services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Ollama runs on your computer, not in the container
      OLLAMA_URL: http://host.docker.internal:11434/api/generate
      HF_HUB_OFFLINE: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3